name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit, fuzz and module tests
        run: npm test
      - name: Production build (fails on registry/file mismatches)
        run: npm run build
